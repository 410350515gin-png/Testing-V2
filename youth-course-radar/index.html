function tband(c){if(c.hours==null)return'unknown';if(c.hours<=8)return'micro';if(c.hours<=40)return'short';if(c.hours<=120)return'mid';if(c.hours<=300)return'intense';return'long'}function tlabel(c){return {unknown:'時數未公開',micro:'單次講座／體驗',short:'短期工作坊',mid:'技能進修',intense:'密集培訓',long:'長期職訓'}[tband(c)]}
function costScore(c){if(c.cost===0)return 100;if(c.cost==null)return 45;return Math.max(20,100-Math.min(c.cost,20000)/250)}function timeScore(c){if(c.hours==null)return 50;if(c.hours<=8)return 100;if(c.hours<=40)return 90;if(c.hours<=120)return 75;if(c.hours<=300)return 55;return 35}
function score(c){if(goal==='job')return Math.round(c.market*.3+c.fit*.3+c.employment*.25+timeScore(c)*.15);if(goal==='cost')return Math.round(costScore(c)*.6+c.market*.15+c.fit*.1+timeScore(c)*.15);if(goal==='beginner')return Math.round(c.beginner*.45+costScore(c)*.2+timeScore(c)*.15+c.quality*.1+c.market*.1);if(goal==='market')return Math.round(c.market*.7+c.fit*.3);return Math.round(c.market*.3+c.fit*.25+c.quality*.2+costScore(c)*.15+c.employment*.1)}
function openish(c){return c.status==='報名中'||c.status==='即將截止'||c.status==='需確認'}function money(c){return c.cost===0?'免費':c.cost==null?'未公開／需確認':'NT$'+c.cost.toLocaleString()}
function list(){var q=applied.toLowerCase(),a=COURSES.filter(function(c){var txt=(c.title+' '+c.provider+' '+c.source+' '+c.skills.join(' ')).toLowerCase();return(!q||txt.indexOf(q)>=0)&&(!$('city').value||c.city===$('city').value)&&(!$('cat').value||c.cat===$('cat').value)&&(!$('status').value||c.status===$('status').value)&&(!$('time').value||tband(c)===$('time').value)&&(!quick.open||openish(c))&&(!quick.free||c.cost===0)&&(!quick.low||(c.hours!=null&&c.hours<=40))&&(!quick.intense||(c.hours!=null&&c.hours>=120))&&(!quick.online||(c.mode==='線上'||c.mode==='混合'))});var s=$('sort').value;if(s==='score')a.sort(function(x,y){return score(y)-score(x)});if(s==='deadline')a.sort(function(x,y){return (x.deadline||'9999')>(y.deadline||'9999')?1:-1});if(s==='market')a.sort(function(x,y){return y.market-x.market});if(s==='hours')a.sort(function(x,y){return (x.hours==null?99999:x.hours)-(y.hours==null?99999:y.hours)});return a}
function render(){var a=list();$('count').textContent='顯示 '+a.length+' / '+COURSES.length+' 筆';$('grid').innerHTML=a.map(function(c){var sel=selected.indexOf(c.id)>=0;return '<article class="card '+(sel?'sel':'')+'"><div class="row"><span class="tag">'+esc(c.cat)+'</span><span class="status '+(c.status==='報名中'?'good':'warn')+'">'+esc(c.status)+'</span></div><h3>'+esc(c.title)+'</h3><div class="desc">'+esc(c.desc)+'</div><div class="row"><div class="score">'+score(c)+'<small>/100</small></div><div class="sub">'+esc(c.city)+' · '+esc(c.mode)+'<br>'+esc(tlabel(c))+'</div></div><div class="metrics"><div class="metric"><small>自付</small><b>'+esc(money(c))+'</b></div><div class="metric"><small>總時數</small><b>'+(c.hours==null?'未公開':esc(c.hours)+'h')+'</b></div><div class="metric"><small>截止</small><b>'+esc(c.deadline||'未公開')+'</b></div><div class="metric"><small>市場需求</small><b>'+c.market+'/100</b></div></div><div class="skills">'+c.skills.slice(0,4).map(function(x){return'<span class="skill">'+esc(x)+'</span>'}).join('')+'</div><div class="actions"><button class="btn" onclick="details(\''+c.id+'\')">查看整理</button><button class="btn '+(sel?'':'primary')+'" onclick="toggle(\''+c.id+'\')">'+(sel?'已加入比較':'＋加入比較')+'</button></div></article>'}).join('')||'<div class="box">沒有符合條件的課程。</div>'}
function submit(){applied=$('search').value.trim();render();$('feedback').textContent=applied?'已搜尋「'+applied+'」：找到 '+list().length+' 筆。':'已套用目前篩選：找到 '+list().length+' 筆。'}
function toggle(id){var i=selected.indexOf(id);if(i>=0)selected.splice(i,1);else{if(selected.length>=3){alert('最多比較 3 門');return}selected.push(id)}dock();render()}function dock(){$('dock').classList.toggle('show',selected.length>0);$('chips').innerHTML=selected.map(function(id){var c=COURSES.find(function(x){return x.id===id});return'<span class="chip">'+esc(c.title)+' <button onclick="toggle(\''+id+'\')">×</button></span>'}).join('')}
function details(id){var c=COURSES.find(function(x){return x.id===id});$('drawerBody').innerHTML='<h2>'+esc(c.title)+'</h2><div class="section"><p><b>主辦／承訓：</b>'+esc(c.provider)+'</p><p><b>來源：</b>'+esc(c.source)+'</p><p><b>資格：</b>'+esc(c.elig)+'</p><p><b>期間：</b>'+esc(c.start)+' ～ '+esc(c.end)+'</p><p><b>投入：</b>'+esc(tlabel(c))+'；'+(c.hours==null?'時數未公開':esc(c.hours)+' 小時')+'</p><p><b>費用：</b>'+esc(money(c))+'</p></div><div class="section"><p><b>主要技能：</b>'+esc(c.skills.join('、'))+'</p><p><b>市場需求：</b>'+c.market+'/100</p><p><b>注意：</b>'+esc(c.risk)+'</p></div><a class="btn primary" style="display:inline-block;text-decoration:none" target="_blank" href="'+esc(c.url)+'">官方來源 ↗</a>';$('back').classList.add('show');$('drawer').classList.add('show')}
function closeDrawer(){$('back').classList.remove('show');$('drawer').classList.remove('show')}
function compare(){if(selected.length<2){alert('至少選 2 門課');return}$('modal').classList.add('show');renderCompare()}
function renderCompare(){var cs=selected.map(function(id){return COURSES.find(function(x){return x.id===id})}).sort(function(a,b){return score(b)-score(a)});var rows=[['綜合分數',function(c){return score(c)},'high'],['地點',function(c){return c.city}],['狀態',function(c){return c.status}],['資格',function(c){return c.elig}],['截止',function(c){return c.deadline||'未公開'}],['投入型態',function(c){return tlabel(c)}],['總時數',function(c){return c.hours==null?'未公開':c.hours+'h'},'low'],['自付',function(c){return money(c)}],['市場需求',function(c){return c.market},'high'],['技能吻合',function(c){return c.fit},'high'],['就業銜接',function(c){return c.employment},'high'],['零基礎友善',function(c){return c.beginner},'high'],['技能',function(c){return c.skills.join('、')}],['機構',function(c){return c.provider}],['注意事項',function(c){return c.risk}]];if(diff)rows=rows.filter(function(r){var vs=cs.map(function(c){return String(r[1](c))});return new Set(vs).size>1});var h='<tr><th>比較項目</th>'+cs.map(function(c){return'<th>'+esc(c.title)+'<br><small>'+score(c)+'分</small></th>'}).join('')+'</tr>';var b=rows.map(function(r){var vals=cs.map(function(c){return r[1](c)}),best=-1;if(r[2]==='high'){var nums=vals.map(Number);best=nums.indexOf(Math.max.apply(null,nums))}if(r[2]==='low'){var hs=cs.map(function(c){return c.hours==null?99999:c.hours});best=hs.indexOf(Math.min.apply(null,hs))}return'<tr><td><b>'+r[0]+'</b></td>'+vals.map(function(v,i){return'<td class="'+(i===best?'best':'')+'">'+esc(v)+(i===best&&r[2]?' ✓':'')+'</td>'}).join('')+'</tr>'}).join('');$('table').innerHTML=h+b;var w=cs[0];$('insight').innerHTML='<b>目前首選：'+esc(w.title)+'</b>（'+score(w)+' 分）。依目前目標，這門課的市場需求、技能吻合、成本／時間或入門門檻組合較有利。請仍以官方資格與最新報名狀態為準。'}
$('apply').onclick=submit;$('search').onkeydown=function(e){if(e.key==='Enter')submit()};['city','cat','status','time','sort'].forEach(function(id){$(id).onchange=render});
function qbtn(id,key){$(id).onclick=function(){quick[key]=!quick[key];$(id).classList.toggle('on',quick[key]);render()}}qbtn('openOnly','open');qbtn('freeOnly','free');qbtn('lowOnly','low');qbtn('intenseOnly','intense');qbtn('onlineOnly','online');
$('reset').onclick=function(){$('search').value='';applied='';['city','cat','status','time'].forEach(function(id){$(id).value=''});$('sort').value='score';quick={open:false,free:false,low:false,intense:false,online:false};document.querySelectorAll('.q').forEach(function(x){x.classList.remove('on')});render();$('feedback').textContent='已重設全部條件。'};$('clear').onclick=function(){selected=[];dock();render()};$('compare').onclick=compare;$('closeModal').onclick=function(){$('modal').classList.remove('show')};$('closeDrawer').onclick=closeDrawer;$('back').onclick=closeDrawer;$('diff').onclick=function(){diff=!diff;$('diff').textContent='只看差異：'+(diff?'開':'關');renderCompare()};document.querySelectorAll('[data-goal]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-goal]').forEach(function(x){x.classList.remove('on')});b.classList.add('on');goal=b.getAttribute('data-goal');render();if($('modal').classList.contains('show'))renderCompare()}});render();
</script></body></html>
