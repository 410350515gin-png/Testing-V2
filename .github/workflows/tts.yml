name: 製作有聲小說
on:
  push:
    paths: ["scripts/**", "*.py", "pipeline.sh", ".github/workflows/tts.yml"]
  workflow_dispatch:
    inputs:
      use_e2a:
        description: "使用 ebook2audiobook（XTTS）；0 = 只用 Edge TTS"
        default: "1"
permissions:
  contents: write
concurrency: tts
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: 釋放磁碟空間
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts
      - name: 片段快取
        uses: actions/cache@v4
        with:
          path: output/edge/片段快取
          key: seg-${{ github.run_id }}
          restore-keys: seg-
      - name: 製作
        env:
          USE_E2A: ${{ github.event.inputs.use_e2a || '1' }}
        run: ./pipeline.sh
      - name: 存回成品
        run: |
          git config user.name "audiobook-bot"
          git config user.email "audiobook-bot@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "產生音檔 [skip ci]"
          git pull --rebase -q && git push
